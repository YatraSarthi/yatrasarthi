<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>YatraSarthi Route Preview</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body, #map {
    height: 100%;
    width: 100%;
    margin: 0;
}
</style>

</head>

<body>

<div id="map"></div>

<script>

var map = L.map('map').setView([12.9716, 77.5946], 13);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/*
 * TEST COORDINATES
 * REVA University
 */

var pickupLat = 13.1156;
var pickupLon = 77.6347;


/*
 * TEST COORDINATES
 * Majestic
 */

var destinationLat = 12.9770;
var destinationLon = 77.5727;


/*
 * Markers
 */

L.marker([pickupLat, pickupLon])
 .addTo(map)
 .bindPopup("Pickup");

L.marker([destinationLat, destinationLon])
 .addTo(map)
 .bindPopup("Destination");


/*
 * OSRM Routing
 */

var url =
    "http://192.168.192.1:8000/route"
    + "?pickup_lat=" + pickupLat
    + "&pickup_lon=" + pickupLon
    + "&destination_lat=" + destinationLat
    + "&destination_lon=" + destinationLon;

fetch(url)

.then(response => response.json())

.then(data => {

    if (!data.routes || data.routes.length === 0) {
        console.log("No route found");
        return;
    }

    var route =
        data.routes[0].geometry.coordinates;

    var latlngs = route.map(function(point) {

        return [
            point[1],
            point[0]
        ];
    });

    var polyline =
        L.polyline(
            latlngs,
            {
                color: "blue",
                weight: 5
            }
        ).addTo(map);

    map.fitBounds(
        polyline.getBounds()
    );
})

.catch(error => {

    console.log(
        "Routing Error:",
        error
    );
});

</script>

</body>
</html>
