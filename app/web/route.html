<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Map</title>

<!-- LOCAL Leaflet — no CDN dependency -->
<link rel="stylesheet" href="./leaflet/leaflet.css">
<script src="./leaflet/leaflet.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #map { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
var map = L.map('map', { zoomControl: false, attributionControl: false });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

var routeLayer   = null;
var pickupMarker = null;
var destMarker   = null;

function makeIcon(color) {
    return L.divIcon({
        className: '',
        html: '<div style="width:14px;height:14px;border-radius:50%;background:' + color
            + ';border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>',
        iconSize:   [14, 14],
        iconAnchor: [7,  7]
    });
}

function setRoute(pickupLat, pickupLon, destLat, destLon) {
    if (!pickupLat || !pickupLon || !destLat || !destLon) return;

    if (pickupMarker) map.removeLayer(pickupMarker);
    if (destMarker)   map.removeLayer(destMarker);
    if (routeLayer)   map.removeLayer(routeLayer);

    pickupMarker = L.marker([pickupLat, pickupLon], { icon: makeIcon('#1976D2') }).addTo(map)
                    .bindPopup('Pickup').openPopup();
    destMarker   = L.marker([destLat,   destLon],   { icon: makeIcon('#E53935') }).addTo(map)
                    .bindPopup('Destination');

    // Draw straight line immediately, then try OSRM route
    var straight = L.polyline([[pickupLat, pickupLon],[destLat, destLon]],
                               { color: '#1976D2', weight: 4, opacity: 0.7 }).addTo(map);
    routeLayer = straight;
    map.fitBounds([[pickupLat, pickupLon],[destLat, destLon]], { padding: [30, 30] });

    // Try to fetch real route via OSRM
    fetch('http://127.0.0.1:8000/route'
          + '?pickup_lat='      + pickupLat
          + '&pickup_lon='      + pickupLon
          + '&destination_lat=' + destLat
          + '&destination_lon=' + destLon)
        .then(function(r){ return r.json(); })
        .then(function(data){
            if (!data.routes || !data.routes[0]) return;
            map.removeLayer(straight);
            var coords = data.routes[0].geometry.coordinates.map(function(c){
                return [c[1], c[0]];
            });
            routeLayer = L.polyline(coords,
                { color: '#1976D2', weight: 5, opacity: 0.85 }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
        })
        .catch(function(){});   // keep straight line on error
}
</script>
</body>
