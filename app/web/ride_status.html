<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>YatraSarthi Ride Status</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body, #map {
    height: 100%;
    width: 100%;
    margin: 0;
}
</style>

</head>

<body>

<div id="map"></div>

<script>

/*
 * Initial Map
 */

var map =
    L.map('map')
     .setView([12.9716, 77.5946], 13);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/*
 * Pickup Marker
 */

var pickupIcon = L.icon({

    iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",

    shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});


/*
 * Destination Marker
 */

var destinationIcon = L.icon({

    iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",

    shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});


/*
 * Driver Icons
 */

var bikeIcon = L.icon({

    iconUrl: "../../assets/icons/bike.png",

    iconSize: [35, 35],
    iconAnchor: [17, 17]
});

var autoIcon = L.icon({

    iconUrl: "../../assets/icons/auto.png",

    iconSize: [35, 35],
    iconAnchor: [17, 17]
});

var cabIcon = L.icon({

    iconUrl: "../../assets/icons/cab.png",

    iconSize: [35, 35],
    iconAnchor: [17, 17]
});


var pickupMarker = null;
var destinationMarker = null;
var driverMarker = null;
var routeLine = null;

var routeLatLngs = [];


/*
 * Called from QML
 */

function setRide(
    pickupLat,
    pickupLon,
    destinationLat,
    destinationLon,
    vehicle
) {

    if (pickupMarker)
        map.removeLayer(pickupMarker);

    if (destinationMarker)
        map.removeLayer(destinationMarker);

    if (driverMarker)
        map.removeLayer(driverMarker);

    if (routeLine)
        map.removeLayer(routeLine);


    pickupMarker =
        L.marker(
            [pickupLat, pickupLon],
            { icon: pickupIcon }
        )
        .addTo(map);


    destinationMarker =
        L.marker(
            [destinationLat, destinationLon],
            { icon: destinationIcon }
        )
        .addTo(map);


    var url =
        "http://127.0.0.1:8000/route"
        + "?pickup_lat=" + pickupLat
        + "&pickup_lon=" + pickupLon
        + "&destination_lat=" + destinationLat
        + "&destination_lon=" + destinationLon;


    fetch(url)

    .then(response => response.json())

    .then(data => {
        
        console.log("Route Response:", data);

        if (!data.routes ||
            data.routes.length === 0) {

            console.log("No route found");
            return;
        }


        var coordinates =
            data.routes[0]
                .geometry
                .coordinates;


        routeLatLngs =
            coordinates.map(function(point) {

                return [
                    point[1],
                    point[0]
                ];
            });

console.log(
    "Coordinates:",
    routeLatLngs.length
);
        routeLine =
            L.polyline(
                routeLatLngs,
                {
                    color: "red",
                    weight: 10,
                    opacity: 1.0
                }
            )
            .addTo(map);

        map.fitBounds(routeLine.getBounds());
 
        var icon = null;

        /*
         * Driver starts far away
         */

        driverMarker =
    L.marker(
        routeLatLngs[0]
    ).addTo(map);
console.log("Driver marker added");

        map.fitBounds(
            routeLine.getBounds(),
            {
                padding: [30, 30]
            }
        );
    })

    .catch(error => {

        console.log(
            "Ride Status Error:",
            error
        );
    });
}


/*
 * Move Driver
 */

function moveDriver(step) {

    if (!driverMarker)
        return;

    if (routeLatLngs.length === 0)
        return;


    /*
     * Convert ETA step (0–8)
     * into route coordinates
     */

    var index = Math.floor(
        (step / 8) *
        (routeLatLngs.length - 1)
    );

    if (index >= routeLatLngs.length)
        index = routeLatLngs.length - 1;


    driverMarker.setLatLng(
        routeLatLngs[index]
    );
}

</script>

</body>

</html>
