<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>YatraSarthi Ride Status</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body, #map {
    height: 100%;
    width: 100%;
    margin: 0;
}
</style>

</head>

<body>

<div id="map"></div>

<script>

function drawRoute(routeCoordinates, vehicle) {

    if (routeLine) {
        map.removeLayer(routeLine);
    }

    routeLatLngs = routeCoordinates;

    routeLine =
        L.polyline(
            routeLatLngs,
            {
                color: "#2196F3",
                weight: 6,
                opacity: 0.9
            }
        ).addTo(map);

    map.fitBounds(
        routeLine.getBounds(),
        {
            padding: [30, 30]
        }
    );

   var icon = L.icon({

    iconUrl: vehicle,

    iconSize: [35, 35],

    iconAnchor: [17, 17]
});

driverMarker =
    L.marker(
        routeLatLngs[0],
        { icon: icon }
    ).addTo(map);
}

/*
 * Initial Map
 */

var map =
    L.map('map')
     .setView([12.9716, 77.5946], 13);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/*
 * Pickup Marker
 */

var pickupIcon = L.icon({

    iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",

    shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});


/*
 * Destination Marker
 */

var destinationIcon = L.icon({

    iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",

    shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});


/*
 * Driver Icons
 */

var bikeIcon = L.icon({

    iconUrl: "../../assets/icons/bike.png",

    iconSize: [35, 35],
    iconAnchor: [17, 17]
});

var autoIcon = L.icon({

    iconUrl: "../../assets/icons/auto.png",

    iconSize: [35, 35],
    iconAnchor: [17, 17]
});

var cabIcon = L.icon({

    iconUrl: "../../assets/icons/cab.png",

    iconSize: [35, 35],
    iconAnchor: [17, 17]
});


var pickupMarker = null;
var destinationMarker = null;
var driverMarker = null;
var routeLine = null;

var routeLatLngs = [];


/*
 * Called from QML
 */

function setRide(
    pickupLat,
    pickupLon,
    destinationLat,
    destinationLon
) {

    if (pickupMarker)
        map.removeLayer(pickupMarker);

    if (destinationMarker)
        map.removeLayer(destinationMarker);

    pickupMarker =
    L.marker(
        [pickupLat, pickupLon],
        { icon: pickupIcon }
    ).addTo(map);

destinationMarker =
    L.marker(
        [destinationLat, destinationLon],
        { icon: destinationIcon }
    ).addTo(map);
}
    

/*
 * Move Driver
 */

function moveDriver(step) {

    if (!driverMarker)
        return;

    if (routeLatLngs.length === 0)
        return;


    /*
     * Convert ETA step (0–8)
     * into route coordinates
     */

    var index = Math.floor(
        (step / 8) *
        (routeLatLngs.length - 1)
    );

    if (index >= routeLatLngs.length)
        index = routeLatLngs.length - 1;


    driverMarker.setLatLng(
        routeLatLngs[index]
    );
}

</script>

</body>

</html>
