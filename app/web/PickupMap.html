<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>YatraSarthi Pickup Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,
body,
#map {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

/*
 * Default Map
 */

var map =
    L.map("map")
     .setView(
         [12.9716, 77.5946],
         13
     );

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/*
 * Markers & Route
 */

var pickupMarker = null;
var driverMarker = null;
var routeLine = null;


/*
 * Pickup Icon
 */

var pickupIcon = L.icon({

    iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",

    shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

    iconSize: [25,41],
    iconAnchor: [12,41]
});


/*
 * Driver Icon
 */

var driverIcon = L.icon({

    iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png",

    shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

    iconSize: [25,41],
    iconAnchor: [12,41]
});


/*
 * Initial markers
 */

function setPickupRide(
    pickupLat,
    pickupLon,
    driverLat,
    driverLon
) {

    if (pickupMarker)
        map.removeLayer(pickupMarker);

    if (driverMarker)
        map.removeLayer(driverMarker);

    pickupMarker =
        L.marker(
            [pickupLat, pickupLon],
            {
                icon: pickupIcon
            }
        )
        .addTo(map)
        .bindPopup(
            "Pickup Location"
        );

    driverMarker =
        L.marker(
            [driverLat, driverLon],
            {
                icon: driverIcon
            }
        )
        .addTo(map)
        .bindPopup(
            "Sarthi"
        );

    var group =
        L.featureGroup([
            pickupMarker,
            driverMarker
        ]);

    map.fitBounds(
        group.getBounds(),
        {
            padding: [40,40]
        }
    );
}


/*
 * Draw actual road route
 * Coordinates come from QML/FastAPI
 */

function drawRoute(
    routePoints
) {

    if (routeLine)
        map.removeLayer(routeLine);

    routeLine =
        L.polyline(
            routePoints,
            {
                color: "#1976D2",
                weight: 6
            }
        )
        .addTo(map);

    map.fitBounds(
        routeLine.getBounds(),
        {
            padding: [40,40]
        }
    );
}


/*
 * Move driver marker
 */

function updateDriver(
    driverLat,
    driverLon
) {

    if (!driverMarker)
        return;

    driverMarker.setLatLng(
        [
            driverLat,
            driverLon
        ]
    );
}


/*
 * Driver arrived
 */

function driverArrived() {

    if (
        driverMarker &&
        pickupMarker
    ) {

        driverMarker.setLatLng(
            pickupMarker.getLatLng()
        );
    }
}

</script>

</body>

</html>
