<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>YatraSarthi Pickup Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,
body,
#map {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

/*
 * Default Map
 */

var map =
    L.map("map")
     .setView(
         [12.9716, 77.5946],
         13
     );

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/*
 * Markers
 */

var pickupMarker = null;
var driverMarker = null;
var routeLine = null;


/*
 * Pickup Icon
 */

var pickupIcon = L.icon({

    iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",

    shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

    iconSize: [25, 41],
    iconAnchor: [12, 41]
});


/*
 * Driver Icon
 */

var driverIcon = L.icon({

    iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png",

    shadowUrl:
        "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

    iconSize: [25, 41],
    iconAnchor: [12, 41]
});


/*
 * Initialize Pickup + Driver
 */

function setPickupRide(
    pickupLat,
    pickupLon,
    driverLat,
    driverLon
) {

    console.log(
        "Pickup:",
        pickupLat,
        pickupLon
    );

    console.log(
        "Driver:",
        driverLat,
        driverLon
    );

    if (pickupMarker)
        map.removeLayer(pickupMarker);

    if (driverMarker)
        map.removeLayer(driverMarker);

    if (routeLine)
        map.removeLayer(routeLine);

    pickupMarker =
        L.marker(
            [pickupLat, pickupLon],
            {
                icon: pickupIcon
            }
        )
        .addTo(map)
        .bindPopup("Pickup Location");

    driverMarker =
        L.marker(
            [driverLat, driverLon],
            {
                icon: driverIcon
            }
        )
        .addTo(map)
        .bindPopup("Sarthi");

    fetch(
    "https://router.project-osrm.org/route/v1/driving/"
    + driverLon + "," + driverLat + ";"
    + pickupLon + "," + pickupLat
    + "?overview=full&geometries=geojson"
)
.then(response => response.json())
.then(data => {

    if (
        data.routes &&
        data.routes.length > 0
    ) {

        var coordinates =
            data.routes[0]
                .geometry
                .coordinates;

        var routePoints = [];

        for (
            var i = 0;
            i < coordinates.length;
            i++
        ) {

            routePoints.push([

                coordinates[i][1],
                coordinates[i][0]

            ]);
        }

        routeLine =
            L.polyline(
                routePoints,
                {
                    color: "#1976D2",
                    weight: 6
                }
            ).addTo(map);

        map.fitBounds(
            routeLine.getBounds(),
            {
                padding: [40, 40]
            }
        );
    }
});

    map.fitBounds(
        routeLine.getBounds(),
        {
            padding: [40, 40]
        }
    );
}


/*
 * Update Driver Position
 */

function updateDriver(
    driverLat,
    driverLon
) {

    if (!driverMarker)
        return;

    driverMarker.setLatLng(
        [
            driverLat,
            driverLon
        ]
    );

    if (
        pickupMarker &&
        routeLine
    ) {

        var pickup =
            pickupMarker.getLatLng();

        fetch(
    "https://router.project-osrm.org/route/v1/driving/"
    + driverLon + "," + driverLat + ";"
    + pickup.lng + "," + pickup.lat
    + "?overview=full&geometries=geojson"
)
.then(response => response.json())
.then(data => {

    if (
        data.routes &&
        data.routes.length > 0
    ) {

        var coordinates =
            data.routes[0]
                .geometry
                .coordinates;

        var routePoints = [];

        for (
            var i = 0;
            i < coordinates.length;
            i++
        ) {

            routePoints.push([
                coordinates[i][1],
                coordinates[i][0]
            ]);
        }

        routeLine.setLatLngs(
            routePoints
        );
    }
});
    }

    map.panTo(
        [
            driverLat,
            driverLon
        ],
        {
            animate: true,
            duration: 1
        }
    );
}

</script>

</body>

</html>
