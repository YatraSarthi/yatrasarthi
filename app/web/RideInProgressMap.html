<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }

        /* ── Pickup pin ── */
        .pin-pickup {
            width: 36px; height: 44px;
            position: relative;
        }
        .pin-pickup svg { width: 36px; height: 44px; }

        /* ── Destination pin ── */
        .pin-dest {
            width: 36px; height: 44px;
            position: relative;
        }
        .pin-dest svg { width: 36px; height: 44px; }

        /* ── Vehicle marker ── */
        .vehicle-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .vehicle-bubble {
            background: white;
            border: 2.5px solid #1976D2;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .vehicle-bubble img {
            display: block;
            object-fit: cover;
        }
        .vehicle-tail {
            width: 3px;
            height: 10px;
            background: #1976D2;
            border-radius: 2px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>

/* ══════════════════════════════════════════════════════════
   Map
══════════════════════════════════════════════════════════ */
var map = L.map("map", { zoomControl: true })
           .setView([12.9716, 77.5946], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
}).addTo(map);

/* ══════════════════════════════════════════════════════════
   State
══════════════════════════════════════════════════════════ */
var pickupMarker      = null;
var destinationMarker = null;
var vehicleMarker     = null;
var routeLine         = null;
var travelledLine     = null;   // darker segment already covered
var vehicleType       = "Cab";
var driverPhoto       = "";
var fullRouteCoords   = [];     // [[lat,lon], ...] full road route
var vehicleRouteIdx   = 0;      // which index vehicle is at

/* ══════════════════════════════════════════════════════════
   Icons
══════════════════════════════════════════════════════════ */

// Green pickup pin (map-pin shape)
function makePickupIcon() {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">'
            + '<path d="M18 0 C8.06 0 0 8.06 0 18 C0 31.5 18 44 18 44 C18 44 36 31.5 36 18 C36 8.06 27.94 0 18 0Z" fill="#2E7D32"/>'
            + '<circle cx="18" cy="18" r="9" fill="white" opacity="0.95"/>'
            + '<circle cx="18" cy="18" r="5" fill="#2E7D32"/>'
            + '</svg>';
    return L.divIcon({
        html: svg, iconSize: [36, 44], iconAnchor: [18, 44],
        popupAnchor: [0, -44], className: ''
    });
}

// Red destination pin
function makeDestIcon() {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44">'
            + '<path d="M18 0 C8.06 0 0 8.06 0 18 C0 31.5 18 44 18 44 C18 44 36 31.5 36 18 C36 8.06 27.94 0 18 0Z" fill="#C62828"/>'
            + '<circle cx="18" cy="18" r="9" fill="white" opacity="0.95"/>'
            + '<circle cx="18" cy="18" r="5" fill="#C62828"/>'
            + '</svg>';
    return L.divIcon({
        html: svg, iconSize: [36, 44], iconAnchor: [18, 44],
        popupAnchor: [0, -44], className: ''
    });
}

// Vehicle marker: driver photo circle + vehicle PNG badge + tail
function makeVehicleIcon(vType, dPhoto) {
    var size   = 52;
    var vImg   = getVehiclePng(vType);
    var dSrc   = dPhoto
                 ? "../../assets/drivers/" + dPhoto
                 : "../../assets/icons/driver.png";

    var html = '<div class="vehicle-wrap">'
             // Driver photo circle
             + '<div class="vehicle-bubble" style="width:' + size + 'px;height:' + size + 'px;">'
             + '<img src="' + dSrc + '" width="' + size + '" height="' + size + '" '
             + 'onerror="this.src=\'../../assets/icons/driver.png\'">'
             + '</div>'
             // Vehicle type PNG badge underneath
             + '<div style="background:white;border:2px solid #1976D2;border-radius:8px;'
             + 'padding:2px 4px;margin-top:2px;display:flex;align-items:center;gap:3px;">'
             + '<img src="' + vImg + '" width="18" height="18" style="object-fit:contain">'
             + '</div>'
             // Tail
             + '<div class="vehicle-tail"></div>'
             + '</div>';

    return L.divIcon({
        html:        html,
        iconSize:    [size, size + 36],
        iconAnchor:  [size / 2, size + 36],
        className:   ''
    });
}

function getVehiclePng(type) {
    if (!type) return "../../assets/icons/rider.png";
    var t = type.toLowerCase();
    if (t === "bike")    return "../../assets/icons/bike.png";
    if (t === "auto")    return "../../assets/icons/auto.png";
    if (t === "carpool") return "../../assets/icons/carpool.png";
    return "../../assets/icons/cab.png";   // Cab default
}

/* ══════════════════════════════════════════════════════════
   QML-callable setters
══════════════════════════════════════════════════════════ */
function setVehicleType(type) {
    vehicleType = type || "Cab";
}

function setDriverPhoto(photo) {
    driverPhoto = photo || "";
}

/* ══════════════════════════════════════════════════════════
   initializeRide  — called once from QML after startRide()
   Places pins + vehicle marker. Does NOT fetch the route itself —
   QML fetches it from the backend and pushes it in via drawRoute().
══════════════════════════════════════════════════════════ */
function initializeRide(pickupLat, pickupLon,
                        destLat,   destLon,
                        vehLat,    vehLon) {

    // Clear old layers
    [pickupMarker, destinationMarker, vehicleMarker,
     routeLine, travelledLine].forEach(function(l) {
        if (l) map.removeLayer(l);
    });
    pickupMarker = destinationMarker = vehicleMarker =
    routeLine    = travelledLine     = null;
    fullRouteCoords = [];
    vehicleRouteIdx = 0;

    // ── Pickup pin ──────────────────────────────────────────
    pickupMarker = L.marker([pickupLat, pickupLon],
        { icon: makePickupIcon(), zIndexOffset: 100 })
        .addTo(map).bindPopup('<b>Pickup</b>');

    // ── Destination pin ─────────────────────────────────────
    destinationMarker = L.marker([destLat, destLon],
        { icon: makeDestIcon(), zIndexOffset: 100 })
        .addTo(map).bindPopup('<b>Destination</b>');

    // ── Vehicle marker ──────────────────────────────────────
    vehicleMarker = L.marker([vehLat, vehLon],
        { icon: makeVehicleIcon(vehicleType, driverPhoto),
          zIndexOffset: 300 })
        .addTo(map).bindPopup('<b>Your ride</b>');

    // Fit pickup + destination + vehicle for now.
    // map.fitBounds() will be called again, tighter, once drawRoute() runs.
    var group = L.featureGroup([pickupMarker, destinationMarker, vehicleMarker]);
    map.fitBounds(group.getBounds(), { padding: [48, 48] });
}

/* ══════════════════════════════════════════════════════════
   drawRoute  — called from QML once it has fetched the road
   route from the backend (FastAPI → OSRM, or whatever routing
   provider). This replaces the old in-page fetch() to OSRM,
   which is unreliable from inside a WebEngineView.

   routePoints: [[lat,lon], [lat,lon], ...]
══════════════════════════════════════════════════════════ */
function drawRoute(routePoints) {

    if (!routePoints || routePoints.length === 0) return;

    fullRouteCoords = routePoints;
    vehicleRouteIdx = 0;

    if (routeLine)     { map.removeLayer(routeLine);     routeLine = null; }
    if (travelledLine) { map.removeLayer(travelledLine); travelledLine = null; }

    // Remaining route (light blue) — full route to start
    routeLine = L.polyline(fullRouteCoords, {
        color:   '#1976D2',
        weight:  6,
        opacity: 0.85
    }).addTo(map);

    // Snap vehicle to closest route point, if vehicle marker already exists
    if (vehicleMarker) {
        var v = vehicleMarker.getLatLng();
        vehicleRouteIdx = closestPointIdx(v.lat, v.lng);
    }

    // Fit full route + pickup + destination
    var bounds = routeLine.getBounds();
    if (pickupMarker)      bounds.extend(pickupMarker.getLatLng());
    if (destinationMarker) bounds.extend(destinationMarker.getLatLng());
    map.fitBounds(bounds, { padding: [48, 48] });

    if (vehicleMarker) vehicleMarker.bringToFront();
}

/* ══════════════════════════════════════════════════════════
   moveVehicle  — called every 5 s from QML timer
══════════════════════════════════════════════════════════ */
function moveVehicle(lat, lon) {
    if (!vehicleMarker) return;

    // Move marker
    vehicleMarker.setLatLng([lat, lon]);

    // Advance along route
    if (fullRouteCoords.length > 0) {
        var newIdx = closestPointIdx(lat, lon);
        if (newIdx > vehicleRouteIdx) vehicleRouteIdx = newIdx;

        // Travelled segment: dark blue, thicker
        if (travelledLine) map.removeLayer(travelledLine);
        if (vehicleRouteIdx > 0) {
            travelledLine = L.polyline(
                fullRouteCoords.slice(0, vehicleRouteIdx + 1),
                { color: '#0D47A1', weight: 7, opacity: 0.9 }
            ).addTo(map);
        }

        // Remaining segment: standard blue
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(
            fullRouteCoords.slice(vehicleRouteIdx),
            { color: '#1976D2', weight: 6, opacity: 0.75 }
        ).addTo(map);

        // Re-bring vehicle on top
        if (vehicleMarker) vehicleMarker.bringToFront();
    }

    // Pan to keep vehicle visible
    if (!map.getBounds().contains([lat, lon])) {
        map.panTo([lat, lon], { animate: true, duration: 0.8 });
    }
}

/* ══════════════════════════════════════════════════════════
   Helper: find closest route point index to [lat,lon]
══════════════════════════════════════════════════════════ */
function closestPointIdx(lat, lon) {
    var best = 0, bestDist = Infinity;
    for (var i = 0; i < fullRouteCoords.length; i++) {
        var dlat = fullRouteCoords[i][0] - lat;
        var dlon = fullRouteCoords[i][1] - lon;
        var d    = dlat * dlat + dlon * dlon;
        if (d < bestDist) { bestDist = d; best = i; }
    }
    return best;
}

</script>
</body>
</html>
