<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
        }
        /* Smooth vehicle rotation */
        .vehicle-icon-img {
            transition: transform 0.4s ease;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>

/* ── Base map ─────────────────────────────────────────────────────────── */
var map = L.map("map", { zoomControl: false })
           .setView([12.9716, 77.5946], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

/* ── State ───────────────────────────────────────────────────────────── */
var pickupMarker      = null;
var destinationMarker = null;
var vehicleMarker     = null;
var routeBorder       = null;   /* white underline layer  */
var routeLine         = null;   /* blue top layer         */
var lastLat           = null;
var lastLon           = null;
var currentVehicleType = "Cab";

/* ── PNG-based icons ─────────────────────────────────────────────────── */

/* Pickup / destination use your existing PNG assets */
var pickupIcon = L.icon({
    iconUrl:    "../../assets/icons/pickup.png",
    iconSize:   [40, 40],
    iconAnchor: [20, 40]
});

var destinationIcon = L.icon({
    iconUrl:    "../../assets/icons/destination.png",
    iconSize:   [40, 40],
    iconAnchor: [20, 40]
});

/* Vehicle — PNG image, centred on position */
function makeVehicleIcon(vehicleType) {
    var img = "../../assets/icons/cab.png";
    if (vehicleType === "Bike")    img = "../../assets/icons/bike.png";
    if (vehicleType === "Auto")    img = "../../assets/icons/auto.png";
    if (vehicleType === "Carpool") img = "../../assets/icons/carpool.png";

    return L.icon({
        iconUrl:    img,
        iconSize:   [48, 48],
        iconAnchor: [24, 24]
    });
}

var vehicleIcon = makeVehicleIcon("Cab");

/* ── setVehicleType — called from QML BEFORE initializeRide ─────────── */
function setVehicleType(type) {
    currentVehicleType = type;
    vehicleIcon = makeVehicleIcon(type);
    if (vehicleMarker) {
        vehicleMarker.setIcon(vehicleIcon);
    }
}

/* ── initializeRide — called from QML once /start-ride responds ─────── */
function initializeRide(
    pickupLat, pickupLon,
    destinationLat, destinationLon,
    vehicleLat, vehicleLon
) {
    /* clear previous session */
    if (pickupMarker)      { map.removeLayer(pickupMarker);      pickupMarker      = null; }
    if (destinationMarker) { map.removeLayer(destinationMarker); destinationMarker = null; }
    if (vehicleMarker)     { map.removeLayer(vehicleMarker);     vehicleMarker     = null; }
    if (routeBorder)       { map.removeLayer(routeBorder);       routeBorder       = null; }
    if (routeLine)         { map.removeLayer(routeLine);         routeLine         = null; }

    lastLat = null;
    lastLon = null;

    pickupMarker = L.marker([pickupLat, pickupLon],
        { icon: pickupIcon }).addTo(map);

    destinationMarker = L.marker([destinationLat, destinationLon],
        { icon: destinationIcon }).addTo(map);

    vehicleMarker = L.marker([vehicleLat, vehicleLon],
        { icon: vehicleIcon }).addTo(map);

    map.fitBounds(L.latLngBounds([
        [pickupLat,      pickupLon],
        [destinationLat, destinationLon],
        [vehicleLat,     vehicleLon]
    ]), { padding: [50, 50] });

    /* draw the full route line pickup → destination */
    fetchRoute(pickupLat, pickupLon, destinationLat, destinationLon);
}

/* ── fetchRoute — XHR (no fetch, avoids file:// CORS block) ─────────── */
function fetchRoute(pickupLat, pickupLon, destinationLat, destinationLon) {
    var url = "http://127.0.0.1:8000/route"
        + "?pickup_lat="      + pickupLat
        + "&pickup_lon="      + pickupLon
        + "&destination_lat=" + destinationLat
        + "&destination_lon=" + destinationLon;

    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status !== 200) {
            console.log("fetchRoute HTTP error:", xhr.status);
            return;
        }
        try {
            var data = JSON.parse(xhr.responseText);
            if (!data.routes || data.routes.length === 0) return;
            var coords = data.routes[0].geometry.coordinates;
            var points = [];
            for (var i = 0; i < coords.length; i++) {
                /* OSRM: [lon, lat] → Leaflet: [lat, lon] */
                points.push([coords[i][1], coords[i][0]]);
            }
            drawRoute(points);
        } catch (e) {
            console.log("fetchRoute parse error:", e);
        }
    };
    xhr.open("GET", url, true);
    xhr.send();
}

/* ── drawRoute — Uber-style dual-layer polyline ─────────────────────── */
function drawRoute(routePoints) {
    if (routeBorder) { map.removeLayer(routeBorder); routeBorder = null; }
    if (routeLine)   { map.removeLayer(routeLine);   routeLine   = null; }

    /* bottom layer: white border gives the "floating" look */
    routeBorder = L.polyline(routePoints, {
        color:   "white",
        weight:  14,
        opacity: 1,
        lineJoin: "round",
        lineCap:  "round"
    }).addTo(map);

    /* top layer: solid blue route */
    routeLine = L.polyline(routePoints, {
        color:   "#1976D2",
        weight:  8,
        opacity: 1,
        lineJoin: "round",
        lineCap:  "round"
    }).addTo(map);

    /* bring vehicle marker above the route line */
    if (vehicleMarker) vehicleMarker.bringToFront();
}

/* ── moveVehicle — called every 5 s from QML, rotates icon ──────────── */
function moveVehicle(lat, lon) {
    if (!vehicleMarker) return;

    /* rotate icon to face direction of travel */
    if (lastLat !== null) {
        var angle = Math.atan2(lon - lastLon, lat - lastLat) * 180 / Math.PI;
        var el = vehicleMarker.getElement();
        if (el) {
            el.style.transition  = "transform 0.4s ease";
            el.style.transformOrigin = "center center";
            el.style.transform   = "rotate(" + angle + "deg)";
        }
    }

    vehicleMarker.setLatLng([lat, lon]);
    lastLat = lat;
    lastLon = lon;
}

</script>
</body>
</html>
