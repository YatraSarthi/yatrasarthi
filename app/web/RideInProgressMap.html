<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body, #map {
            margin:  0;
            padding: 0;
            width:   100%;
            height:  100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>

/* ── Base map ──────────────────────────────────────────────────── */

var map = L.map("map", { zoomControl: false })
           .setView([12.9716, 77.5946], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
}).addTo(map);

/* ── State ─────────────────────────────────────────────────────── */

var pickupMarker      = null;
var destinationMarker = null;
var vehicleMarker     = null;
var routeLine         = null;

/* ── Icons ─────────────────────────────────────────────────────── */

function makeCircleIcon(color, label) {
    var svg = [
        '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36">',
        '  <circle cx="18" cy="18" r="14" fill="', color,
        '" stroke="white" stroke-width="3"/>',
        '  <text x="18" y="23" text-anchor="middle"',
        '        font-size="13" font-weight="bold" fill="white"',
        '        font-family="sans-serif">', label, '</text>',
        '</svg>'
    ].join('');
    return L.divIcon({
        html:       svg,
        iconSize:   [36, 36],
        iconAnchor: [18, 18],
        className:  ''
    });
}

/* Vehicle icon — emoji in a colored rounded square */
function makeVehicleIcon(vehicleType) {
    var emoji = "🚗";
    if (vehicleType === "Bike")    emoji = "🏍️";
    if (vehicleType === "Auto")    emoji = "🛺";
    if (vehicleType === "Carpool") emoji = "🚐";

    var svg = [
        '<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44">',
        '  <rect x="2" y="2" width="40" height="40" rx="10"',
        '        fill="#1976D2" stroke="white" stroke-width="2.5"/>',
        '  <text x="22" y="31" text-anchor="middle"',
        '        font-size="22" font-family="sans-serif">', emoji, '</text>',
        '</svg>'
    ].join('');
    return L.divIcon({
        html:       svg,
        iconSize:   [44, 44],
        iconAnchor: [22, 22],
        className:  ''
    });
}

var pickupIcon      = makeCircleIcon("#4CAF50", "P");
var destinationIcon = makeCircleIcon("#F44336", "D");
var vehicleIcon     = makeVehicleIcon("Cab");   /* default; overridden by setVehicleType() */

/* ── setVehicleType — called from QML before initializeRide ────── */

function setVehicleType(type) {
    vehicleIcon = makeVehicleIcon(type);
    if (vehicleMarker) {
        vehicleMarker.setIcon(vehicleIcon);
    }
}

/* ── initializeRide — called from QML ──────────────────────────── */

function initializeRide(
    pickupLat, pickupLon,
    destinationLat, destinationLon,
    vehicleLat, vehicleLon
) {
    /* clear old layers */
    if (pickupMarker)      { map.removeLayer(pickupMarker);      pickupMarker      = null; }
    if (destinationMarker) { map.removeLayer(destinationMarker); destinationMarker = null; }
    if (vehicleMarker)     { map.removeLayer(vehicleMarker);     vehicleMarker     = null; }
    if (routeLine)         { map.removeLayer(routeLine);         routeLine         = null; }

    pickupMarker = L.marker(
        [pickupLat, pickupLon],
        { icon: pickupIcon }
    ).addTo(map);

    destinationMarker = L.marker(
        [destinationLat, destinationLon],
        { icon: destinationIcon }
    ).addTo(map);

    vehicleMarker = L.marker(
        [vehicleLat, vehicleLon],
        { icon: vehicleIcon }
    ).addTo(map);

    map.fitBounds(L.latLngBounds([
        [pickupLat,      pickupLon],
        [destinationLat, destinationLon],
        [vehicleLat,     vehicleLon]
    ]), { padding: [40, 40] });

    /* fetch full OSRM route and draw blue polyline */
    fetchRoute(pickupLat, pickupLon, destinationLat, destinationLon);
}

/* ── fetchRoute — calls backend /route and draws blue polyline ─── */

function fetchRoute(pickupLat, pickupLon, destinationLat, destinationLon) {
    var url =
        "http://127.0.0.1:8000/route"
        + "?pickup_lat="      + pickupLat
        + "&pickup_lon="      + pickupLon
        + "&destination_lat=" + destinationLat
        + "&destination_lon=" + destinationLon;

    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.routes || data.routes.length === 0) return;

            var coords = data.routes[0].geometry.coordinates;
            var points = [];
            for (var i = 0; i < coords.length; i++) {
                /* OSRM returns [lon, lat] — flip to [lat, lon] for Leaflet */
                points.push([coords[i][1], coords[i][0]]);
            }
            drawRoute(points);
        })
        .catch(function(e) { console.log("fetchRoute error:", e); });
}

/* ── drawRoute — blue polyline ──────────────────────────────────── */

function drawRoute(routePoints) {
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    routeLine = L.polyline(routePoints, {
        color:   '#1976D2',
        weight:  5,
        opacity: 0.85
    }).addTo(map);
}

/* ── moveVehicle — called every 5 s from QML ───────────────────── */

function moveVehicle(lat, lon) {
    if (vehicleMarker) {
        vehicleMarker.setLatLng([lat, lon]);
    }
}

/* ── default view on load ───────────────────────────────────────── */
map.setView([12.9716, 77.5946], 13);

</script>
</body>
</html>
