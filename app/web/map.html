<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>YatraSarthi Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html, body, #map { height: 100%; width: 100%; margin: 0; }
#status {
    position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.72); color: white;
    padding: 6px 16px; border-radius: 20px;
    font-family: sans-serif; font-size: 13px;
    z-index: 1000; white-space: nowrap;
    display: none; max-width: 90%;
    overflow: hidden; text-overflow: ellipsis;
}
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Resolving address…</div>

<script>
var selectedLat    = null;
var selectedLon    = null;
var selectedShort  = null;
var selectedFull   = null;
var geocodePending = false;

var map = L.map('map').setView([12.9716, 77.5946], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var marker   = null;
var statusEl = document.getElementById('status');

map.on('click', function(e) {
    selectedLat    = e.latlng.lat;
    selectedLon    = e.latlng.lng;
    selectedShort  = null;
    selectedFull   = null;
    geocodePending = true;

    if (marker) map.removeLayer(marker);
    marker = L.marker([selectedLat, selectedLon]).addTo(map);
    marker.bindPopup('Resolving address…').openPopup();

    statusEl.style.display = 'block';
    statusEl.textContent   = 'Resolving address…';

    // Same origin as FastAPI — no CORS, no file:// issue
    fetch('/reverse-geocode?lat=' + selectedLat + '&lon=' + selectedLon)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            selectedShort  = data.address      || (selectedLat.toFixed(5) + ', ' + selectedLon.toFixed(5));
            selectedFull   = data.full_address || selectedShort;
            geocodePending = false;
            statusEl.textContent = selectedShort;
            marker.getPopup().setContent(selectedShort).update();
        })
        .catch(function() {
            selectedShort  = selectedLat.toFixed(5) + ', ' + selectedLon.toFixed(5);
            selectedFull   = selectedShort;
            geocodePending = false;
            statusEl.textContent = selectedShort;
        });
});

function getSelectionJSON() {
    return JSON.stringify({
        lat:     selectedLat,
        lon:     selectedLon,
        short:   selectedShort,
        full:    selectedFull,
        pending: geocodePending
    });
}
</script>
</body>
</html>
